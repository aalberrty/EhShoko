name: Test
on:
  # The repository is private, where a run on a Mac counts ten times against the
  # account's minutes, so runs are started by hand: gh workflow run Test --ref <branch>
  workflow_dispatch:
env:
   SCHEME_NAME: 'EhGaro'
   DEVELOPER_DIR: /Applications/Xcode_26.6.app
jobs:
  Test:
    runs-on: macos-26
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install iOS 26 Platform
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 10
          timeout_minutes: 999
          command: xcodebuild -downloadPlatform iOS
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run package tests
        run: swift test --package-path Packages/EhKit
      - name: Build app for simulator
        run: xcodebuild build
          -project EhGaro.xcodeproj
          -scheme ${{ env.SCHEME_NAME }}
          -destination 'generic/platform=iOS Simulator'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO
