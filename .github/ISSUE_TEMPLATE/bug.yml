name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App version and iOS version
      placeholder: 3.0 (158), iOS 26.3
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone 17 Pro
  - type: textarea
    id: more
    attributes:
      label: Screenshots or logs
      description: Settings › General › Logs can export a log file.
